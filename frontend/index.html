<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>do-not-forget</title>
<style>
:root {
  --bg: #f7f7f8; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea;
  --accent: #0a84ff; --danger: #ff453a; --warn: #ff9f0a;
  --work: #0a84ff; --personal: #30d158;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1c1c1e; --card: #2c2c2e; --text: #f2f2f7; --muted: #98989f; --line: #3a3a3c; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font: 13px/1.4 -apple-system, "Segoe UI", system-ui, Cantarell, sans-serif;
  background: var(--bg); color: var(--text); height: 100vh;
  display: flex; flex-direction: column; overflow: hidden; user-select: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

header { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: center; }
header h1 { font-size: 15px; font-weight: 600; }
header small { color: var(--muted); display: block; font-size: 12px; }
.chips { display: flex; gap: 6px; }
.chip { display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 99px;
  background: var(--card); border: 1px solid var(--line); font-size: 11px; }
.chip.off { opacity: .4; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.hero { margin: 0 12px 10px; padding: 14px; border-radius: 12px; background: var(--card);
  border-left: 4px solid var(--c); box-shadow: 0 1px 3px #0000001a; }
.hero .when { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--c); }
.hero .title { font-size: 16px; font-weight: 600; margin: 3px 0 2px; }
.hero .meta { color: var(--muted); font-size: 12px; }
.hero .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.progress { height: 3px; border-radius: 2px; background: var(--line); margin-top: 10px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--c); }
.join { background: var(--accent); color: #fff; padding: 6px 14px; border-radius: 8px; font-weight: 600; }

.tabs { display: flex; margin: 0 12px; background: var(--line); border-radius: 8px; padding: 2px; }
.tabs button { flex: 1; padding: 4px; border-radius: 6px; font-size: 12px; color: var(--muted); }
.tabs button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px #0000001a; }

main { flex: 1; overflow-y: auto; padding: 8px 12px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.ev { display: flex; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; position: relative; }
.ev:hover { background: var(--card); }
.ev.past { opacity: .45; }
.ev .time { width: 42px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.ev .time small { display: block; color: var(--muted); font-size: 11px; }
.ev .bar { width: 3px; border-radius: 2px; background: var(--c); flex: none; }
.ev .body { flex: 1; min-width: 0; }
.ev .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .sub { color: var(--muted); font-size: 12px; }
/* RSVP: pending = dashed bar, maybe = hollow bar, declined = struck through */
.ev.rsvp-pending .bar { background: repeating-linear-gradient(var(--c) 0 3px, transparent 3px 6px); }
.ev.rsvp-maybe .bar { background: none; border: 1px solid var(--c); width: 3px; }
.ev.rsvp-no { opacity: .45; }
.ev.rsvp-no .name { text-decoration: line-through; }
.tag { font-size: 10px; font-weight: 600; padding: 0 5px; border-radius: 4px; margin-left: 4px; }
.tag.pending { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.tag.maybe { color: var(--muted); background: var(--line); }
.rsvp { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; width: fit-content; }
.rsvp button { padding: 3px 12px; font-size: 12px; border-right: 1px solid var(--line); }
.rsvp button:last-child { border-right: 0; }
.rsvp button:hover { background: var(--line); }
.rsvp button.on[data-respond=yes] { background: var(--personal); color: #fff; }
.rsvp button.on[data-respond=maybe] { background: var(--warn); color: #fff; }
.rsvp button.on[data-respond=no] { background: var(--danger); color: #fff; }
.hero .ask { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--warn); font-weight: 600; }
.person.maybe b { background: var(--warn); color: #fff; }
.conflict { margin: 4px 0; padding: 2px 0 2px; border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
  background: color-mix(in srgb, var(--danger) 7%, transparent); }
.conflict.past { opacity: .45; }
.conflict .ev.past { opacity: 1; }
.conflict-head { padding: 4px 10px 0; font-size: 10px; font-weight: 600; letter-spacing: .03em;
  text-transform: uppercase; color: var(--danger); }
.ev .cam { align-self: center; color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 6px; }
.ev .cam:hover { background: var(--line); }
.now { display: flex; align-items: center; gap: 6px; color: var(--danger); font-size: 10px; font-weight: 600; margin: 2px 0; }
.now::after { content: ""; flex: 1; height: 1px; background: var(--danger); }
.allday { padding: 5px 10px; margin-bottom: 6px; border-radius: 6px; font-size: 12px;
  background: color-mix(in srgb, var(--c) 18%, transparent); }

/* Expanded event: row + detail in one card, full width */
.open-card { margin: 4px 0; border-radius: 10px; background: var(--card);
  border: 1px solid color-mix(in srgb, var(--c) 55%, var(--line)); box-shadow: 0 2px 8px #00000026; }
.open-card .ev:hover { background: none; }
.detail { padding: 2px 12px 12px; font-size: 12px; display: grid; gap: 8px;
  border-top: 1px solid var(--line); margin: 0 8px; padding-top: 10px; }
.detail .k { color: var(--muted); font-size: 11px; }
.people { display: flex; flex-wrap: wrap; gap: 4px; }
.person { padding: 2px 6px 2px 2px; border-radius: 99px; background: var(--bg); display: flex; gap: 4px; align-items: center; }
.person b { width: 18px; height: 18px; border-radius: 50%; background: var(--line); font-size: 9px;
  display: grid; place-items: center; }
.person.yes b { background: var(--personal); color: #fff; }
.person.no b { background: var(--danger); color: #fff; }
.actions { display: flex; gap: 6px; }
.actions button { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); }
.actions .join { border: 0; }

footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px;
  border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
footer button { padding: 2px 6px; border-radius: 6px; }
footer button:hover { background: var(--line); color: var(--text); }
</style>
</head>
<body>
<header>
  <div><h1 id="today"></h1><small id="summary"></small></div>
  <div class="chips" id="chips"></div>
</header>
<section id="hero"></section>
<nav class="tabs"><button data-day="0" class="on">Dnes</button><button data-day="1">Zajtra</button></nav>
<main id="list"></main>
<footer>
  <span id="sync"></span>
  <span><button id="refresh" title="Obnoviť">⟳</button><button title="Nastavenia">⚙</button></span>
</footer>

<script type="module">
import { Events, Browser } from "/wails/runtime.js";

// Filled by the Go side via the "events" event; dates arrive as RFC3339 strings.
let events = [], synced = null;
const at = (day, h, m = 0) => { const d = new Date(); d.setDate(d.getDate() + day); d.setHours(h, m, 0, 0); return d; };

const hidden = new Set();
let day = 0, open = null; // open: id of the expanded event

const hm = (d) => d.toLocaleTimeString("sk", { hour: "2-digit", minute: "2-digit" });
const dur = (e) => { const m = Math.round((e.end - e.start) / 60000); return m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) + " min" : ""}` : `${m} min`; };
const until = (d) => { const m = Math.round((d - Date.now()) / 60000); return m < 60 ? `o ${m} min` : `o ${Math.floor(m / 60)} h ${m % 60} min`; };
const svc = (l) => l.includes("zoom") ? "Zoom" : l.includes("teams") ? "Teams" : "Meet";
const sameDay = (d, n) => d.toDateString() === at(n, 0).toDateString();
const visible = () => events.filter((e) => !hidden.has(e.calendar));
const rsvp = (e) => `<div class="rsvp">${[["yes", "Áno"], ["maybe", "Možno"], ["no", "Nie"]].map(([r, l]) =>
  `<button data-respond="${r}" data-id="${esc(e.id)}" class="${e.response === r ? "on" : ""}">${l}</button>`).join("")}</div>`;
const ago = (d) => { const m = Math.round((Date.now() - d) / 60000); return m < 1 ? "práve teraz" : `pred ${m} min`; };
const esc = (s) => s.replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);

function render() {
  const now = new Date();
  document.getElementById("today").textContent = now.toLocaleDateString("sk", { weekday: "long", day: "numeric", month: "long" });
  const todayLeft = visible().filter((e) => sameDay(e.start, 0) && !e.allDay && e.response !== "no" && e.end > now);
  document.getElementById("summary").textContent = `Dnes ešte ${todayLeft.length} udalostí`;
  document.getElementById("sync").textContent = synced ? `Synchronizované ${ago(synced)}` : "Načítavam…";

  const calendars = new Map(events.map((e) => [e.calendar, e.color]));
  document.getElementById("chips").innerHTML = [...calendars].map(([name, color]) =>
    `<button class="chip ${hidden.has(name) ? "off" : ""}" data-cal="${esc(name)}"><span class="dot" style="background:${color}"></span>${esc(name)}</button>`).join("");

  // Hero: running meeting, else next one.
  const next = visible().filter((e) => !e.allDay && e.response !== "no" && e.end > now).sort((a, b) => a.start - b.start)[0];
  const hero = document.getElementById("hero");
  if (!next) { hero.innerHTML = ""; } else {
    const running = next.start <= now;
    const pct = running ? (now - next.start) / (next.end - next.start) * 100 : 0;
    hero.innerHTML = `<div class="hero" style="--c:${next.color}">
      <div class="when">${running ? "Prebieha · končí " + hm(next.end) : "Ďalej · " + until(next.start)}</div>
      <div class="title">${esc(next.title)}</div>
      <div class="meta">${hm(next.start)} – ${hm(next.end)} · ${dur(next)}${next.location ? " · " + esc(next.location) : ""}</div>
      ${running ? `<div class="progress"><i style="width:${pct}%"></i></div>` : ""}
      ${next.response === "pending" ? `<div class="ask">Zúčastníš sa? ${rsvp(next)}</div>` : ""}
      ${next.link ? `<div class="row"><span class="meta">${(next.attendees || []).length} účastníkov</span><button class="join" data-url="${esc(next.link)}">Pripojiť cez ${svc(next.link)}</button></div>` : ""}
    </div>`;
  }

  // List
  const list = visible().filter((e) => sameDay(e.start, day)).sort((a, b) => a.start - b.start);
  const timed = list.filter((e) => !e.allDay);
  let html = list.filter((e) => e.allDay).map((e) =>
    `<div class="allday" style="--c:${e.color}">🎂 ${esc(e.title)}</div>`).join("");
  // Overlapping events form one cluster; clusters of 2+ render as a conflict group.
  const clusters = [];
  for (const e of timed) {
    const c = clusters.at(-1);
    // Declined events never cause a conflict.
    if (c && !c.declined && e.response !== "no" && e.start < c.end) { c.items.push(e); if (e.end > c.end) c.end = e.end; }
    else if (e.response === "no") clusters.push({ start: e.start, end: e.end, items: [e], declined: true });
    else clusters.push({ start: e.start, end: e.end, items: [e] });
  }
  let nowShown = day !== 0;
  for (const c of clusters) {
    if (!nowShown && c.start > now) { html += `<div class="now">${hm(now)}</div>`; nowShown = true; }
    const rows = c.items.map(row).join("");
    html += c.items.length < 2 ? rows : `<div class="conflict ${c.end < now ? "past" : ""}">
      <div class="conflict-head">⚠ Kolízia · ${hm(c.start)} – ${hm(c.end)}</div>${rows}</div>`;
  }
  if (!nowShown) html += `<div class="now">${hm(now)}</div>`;
  document.getElementById("list").innerHTML = list.length ? html : `<div class="empty">Voľný deň 🎉</div>`;
}

function row(e) {
  if (open === e.id) return `<div class="open-card" style="--c:${e.color}">${rowHTML(e)}${detail(e)}</div>`;
  return rowHTML(e);
}

function rowHTML(e) {
  const now = new Date();
  const tag = e.response === "pending" ? `<span class="tag pending">Neodpovedané</span>`
    : e.response === "maybe" ? `<span class="tag maybe">Možno</span>` : "";
  return `<div class="ev ${e.end < now ? "past" : ""} ${e.response ? "rsvp-" + e.response : ""}" data-id="${esc(e.id)}" style="--c:${e.color}">
      <div class="time">${hm(e.start)}<small>${hm(e.end)}</small></div>
      <div class="bar"></div>
      <div class="body"><div class="name">${esc(e.title)}${tag}</div>
        <div class="sub">${dur(e)} · ${esc(e.calendar)}${e.location ? " · " + esc(e.location) : ""}</div></div>
      ${e.link && e.end > now ? `<button class="cam" data-url="${esc(e.link)}">${svc(e.link)}</button>` : ""}
    </div>`;
}

function detail(e) {
  const people = (e.attendees || []).map((p) =>
    `<span class="person ${esc(p.status)}"><b>${esc(p.name[0])}</b>${esc(p.name)}</span>`).join("");
  const actions = (e.link ? `<button class="join" data-url="${esc(e.link)}">Pripojiť sa</button>` : "") +
    (e.calendarUrl ? `<button data-url="${esc(e.calendarUrl)}">Otvoriť v kalendári</button>` : "");
  const body = [
    e.link && `<div><div class="k">Odkaz</div>${esc(e.link)}</div>`,
    e.description && `<div><div class="k">Popis</div>${esc(e.description)}</div>`,
    e.response && `<div><div class="k">Zúčastníš sa?</div>${rsvp(e)}</div>`,
    people && `<div><div class="k">Účastníci</div><div class="people">${people}</div></div>`,
    actions && `<div class="actions">${actions}</div>`,
  ].filter(Boolean).join("");
  return body && `<div class="detail">${body}</div>`; // nothing to show → just the outlined row
}

document.addEventListener("click", (ev) => {
  const t = ev.target;
  const ans = t.closest("[data-respond]");
  if (ans) {
    const e = events.find((x) => x.id === ans.dataset.id);
    if (e) e.response = ans.dataset.respond; // optimistic, the backend refresh confirms
    Events.Emit("respond", { id: ans.dataset.id, response: ans.dataset.respond });
    return render();
  }
  const link = t.closest("[data-url]");
  if (link) return Browser.OpenURL(link.dataset.url);
  if (t.closest("#refresh")) return Events.Emit("refresh");
  const chip = t.closest(".chip");
  if (chip) { const c = chip.dataset.cal; hidden.has(c) ? hidden.delete(c) : hidden.add(c); return render(); }
  const tab = t.closest(".tabs button");
  if (tab) {
    day = +tab.dataset.day; open = null;
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b === tab));
    return render();
  }
  const row = t.closest(".ev");
  if (row) { open = open === row.dataset.id ? null : row.dataset.id; render(); }
});

Events.On("events", ({ data }) => {
  events = data.events.map((e) => ({ ...e, start: new Date(e.start), end: new Date(e.end) }));
  synced = new Date(data.synced);
  render();
});
Events.Emit("refresh");
render();
setInterval(render, 30000);
</script>
</body>
</html>
