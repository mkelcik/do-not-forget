version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned: platform_linux.go reaches into its internals; upgrade by hand and check the KDE tooltip.
      - dependency-name: github.com/wailsapp/wails/v3
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
