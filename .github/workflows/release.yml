name: Release

# Push a tag like v1.2.3 on a commit that is on main:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  on-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

  ci:
    needs: on-main
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04 }      # linux/amd64
          - { os: ubuntu-24.04-arm }  # linux/arm64
          - { os: macos-15 }          # darwin/arm64
          - { os: windows-2025 }      # windows/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Package
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/dist.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The in-app updater verifies every download against SHA256SUMS and <asset>.sig
      # (Ed25519 over the asset's SHA-256, public key in signing.go).
      - name: Checksums and signatures
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::UPDATE_SIGNING_KEY secret missing"; exit 1; }
          cd dist
          sha256sum * > SHA256SUMS
          key="$(mktemp)"; trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          for f in do-not-forget_*; do
            # Ed25519 one-shot signing needs a sized input, so no pipe.
            openssl dgst -sha256 -binary -out "$f.digest" "$f"
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$f.digest" -out "$f.sig"
            rm "$f.digest"
          done
          openssl pkey -in "$key" -pubout   # log the public half to compare with signing.go
          ls -l; cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac  # v1.2.3-rc1
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
