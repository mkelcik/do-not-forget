name: Release

# Push a tag like v1.2.3 on a commit that is on main:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  on-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

  ci:
    needs: on-main
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04 }      # linux/amd64
          - { os: ubuntu-24.04-arm }  # linux/arm64
          - { os: macos-15 }          # darwin/arm64
          - { os: windows-2025 }      # windows/amd64
          - { os: windows-2025, goarch: arm64 } # windows/arm64: pure Go on Windows, cross-compiled
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev dpkg-dev rpm
      - name: Package
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOARCH: ${{ matrix.goarch }} # empty = the runner's own arch
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/dist.sh
      - name: Check Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(dpkg-deb -f dist/*.deb Package)" = do-not-forget
          test "$(dpkg-deb -f dist/*.deb Architecture)" = "$(go env GOARCH)"
          dpkg-deb --extract dist/*.deb build/deb-check
          test -x build/deb-check/usr/bin/do-not-forget
          cmp build/do-not-forget build/deb-check/usr/bin/do-not-forget
          test -f build/deb-check/usr/share/applications/do-not-forget.desktop
          test -f build/deb-check/usr/share/icons/hicolor/scalable/apps/do-not-forget.svg
      - name: Check RPM package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(rpm -qp --qf '%{NAME}' dist/*.rpm)" = do-not-forget
          rpm -qpl dist/*.rpm | grep -qx /usr/bin/do-not-forget
          rpm -qpR dist/*.rpm | grep -q '^libwebkitgtk-6.0.so.4'
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}-${{ matrix.goarch || 'native' }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The in-app updater verifies every download against SHA256SUMS and <asset>.sig
      # (Ed25519 over the asset's SHA-256, public key in signing.go).
      - name: Checksums and signatures
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::UPDATE_SIGNING_KEY secret missing"; exit 1; }
          cd dist
          sha256sum * > SHA256SUMS
          key="$(mktemp)"; pub="$(mktemp)"; trap 'rm -f "$key" "$pub"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out "$pub"
          cat "$pub"   # log the public half to compare with signing.go
          version="${GITHUB_REF_NAME#v}"
          for f in do-not-forget_*; do
            # <asset>.sig: over the SHA-256 alone (0.8.0 and 0.8.1 check only this).
            # Ed25519 one-shot signing needs a sized input, so no pipe.
            openssl dgst -sha256 -binary -out "$f.digest" "$f"
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$f.digest" -out "$f.sig"
            rm "$f.digest"
            # Packages are installed by apt/dnf, not the in-app updater; only archives need a manifest.
            case "$f" in *.deb|*.rpm) continue;; esac
            # <asset>.manifest.sig: version, platform and hash together, so an old archive can't
            # pass as a newer version. Byte for byte updateManifest in signing.go.
            platform="${f%%.*}"; platform="${platform#do-not-forget_}"   # darwin_arm64
            printf 'do-not-forget update\nversion: %s\nos: %s\narch: %s\nasset: %s\nsha256: %s\n' \
              "$version" "${platform%_*}" "${platform#*_}" "$f" "$(sha256sum "$f" | cut -d' ' -f1)" > "$f.manifest"
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$f.manifest" -out "$f.manifest.sig"
            openssl pkeyutl -verify -pubin -inkey "$pub" -rawin -in "$f.manifest" -sigfile "$f.manifest.sig"
            rm "$f.manifest"
          done
          ls -l; cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac  # v1.2.3-rc1
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease

  # Bumps the cask in mkelcik/homebrew-tap to this release. Needs HOMEBREW_TAP_TOKEN: a
  # fine-grained token with Contents read & write on that repository only. Without it, or for a
  # pre-release, the release still succeeds and the cask stays as it is.
  homebrew:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Update the cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; the Homebrew cask wasn't updated"; exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          sha="$(gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -O - |
            awk '$2 == "do-not-forget_darwin_arm64.zip" { print $1 }')"
          test -n "$sha" || { echo "::error::no darwin_arm64 checksum in SHA256SUMS"; exit 1; }
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/mkelcik/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/do-not-forget.rb
          git diff --quiet && { echo "cask already at $version"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "do-not-forget $version"
          git push -q

  # Pushes packaging/aur/PKGBUILD with this version and the .deb checksums to the AUR package
  # do-not-forget-bin. Needs AUR_SSH_KEY: a private key registered with an AUR account. Without
  # it, or for a pre-release, the release still succeeds and the AUR package stays as it is.
  aur:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Update the AUR package
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::warning::AUR_SSH_KEY not set; the AUR package wasn't updated"; exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          sums="$(gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -O -)"
          sha() { awk -v f="do-not-forget_${version}_$1.deb" '$2 == f { print $1 }' <<<"$sums"; }
          amd64="$(sha amd64)"; arm64="$(sha arm64)"
          test -n "$amd64" && test -n "$arm64" || { echo "::error::no .deb checksums in SHA256SUMS"; exit 1; }
          key="$(mktemp)"; trap 'rm -f "$key"' EXIT
          printf '%s\n' "$AUR_SSH_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o StrictHostKeyChecking=accept-new"
          git clone -q ssh://aur@aur.archlinux.org/do-not-forget-bin.git aur
          sed -E "s/^pkgver=.*/pkgver=$version/; s/^pkgrel=.*/pkgrel=1/;
            s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$amd64')/;
            s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$arm64')/" packaging/aur/PKGBUILD > aur/PKGBUILD
          # makepkg only runs on Arch, and not as root.
          docker run --rm -v "$PWD/aur:/aur:ro" archlinux:latest \
            bash -c 'useradd -m b && cp /aur/PKGBUILD /home/b && cd /home/b && su b -c "makepkg --printsrcinfo"' > aur/.SRCINFO
          cd aur
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && { echo "AUR already at $version"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "do-not-forget $version"
          git push -q origin HEAD:master
